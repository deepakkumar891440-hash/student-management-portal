<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Management Portal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>Student Management Portal</h2>
    
    <!-- Input Form -->
    <form id="studentForm">
      <input type="text" id="rollNo" placeholder="Roll Number" required />
      <input type="text" id="name" placeholder="Student Name" required />
      <input type="text" id="branch" placeholder="Branch (e.g. IT)" required />
      <input type="number" id="marks" placeholder="Marks (%)" required />
      <button type="submit" id="submitBtn">Add Student</button>
    </form>

    <!-- Search Box -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search by Roll No or Name..." onkeyup="filterStudents()" />
    </div>

    <!-- Student Records Table -->
    <table>
      <thead>
        <tr>
          <th>Roll No</th>
          <th>Name</th>
          <th>Branch</th>
          <th>Marks</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="studentTableBody">
        <!-- Records yahan dynamic insert honge -->
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
