<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Management Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #06b6d4;
      --primary-dark: #0891b2;
      --accent: #3b82f6;
      --bg: #030712;
      --card-bg: rgba(15, 23, 42, 0.88);
      --input-bg: #0b1329;
      --border: rgba(56, 189, 248, 0.18);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #f43f5e;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.18) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.18) 0px, transparent 50%);
      color: var(--text-main);
      padding: 24px 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1080px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 28px;
      border: 1px solid var(--border);
      padding: 36px 28px;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.7), 0 0 45px rgba(6, 182, 212, 0.12);
    }

    .auth-container {
      max-width: 440px;
      padding: 40px 32px;
      text-align: center;
    }

    /* Rotating Circular Badge */
    .header-branding {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 26px;
      text-align: center;
      position: relative;
    }

    .rotating-badge-box {
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .circular-text-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      animation: rotateText 16s linear infinite;
    }

    .circular-text-svg text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 2.8px;
      fill: #38bdf8;
      text-transform: uppercase;
    }

    @keyframes rotateText {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .core-circle {
      width: 72px;
      height: 72px;
      background: #000000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.2);
      z-index: 2;
    }

    .student-svg-icon {
      width: 38px;
      height: 38px;
      fill: #ffffff;
      filter: drop-shadow(0 2px 5px rgba(255, 255, 255, 0.3));
    }

    h2.portal-title {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.4px;
    }

    p.portal-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Auth Forms */
    .auth-form-box {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 13.5px;
      background: var(--input-bg);
      color: #ffffff;
      outline: none;
      transition: all 0.25s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
      background: #0f1c3f;
    }

    input::placeholder {
      color: #475569;
    }

    /* Modern Buttons */
    .btn-submit {
      background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
      color: #ffffff;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 8px 20px -4px rgba(6, 182, 212, 0.45);
      transition: all 0.25s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px -4px rgba(6, 182, 212, 0.6);
    }

    .header-actions {
      position: absolute;
      top: 0;
      right: 0;
    }

    .btn-logout {
      background: rgba(244, 63, 94, 0.12);
      color: var(--danger);
      border: 1px solid rgba(244, 63, 94, 0.3);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-logout:hover {
      background: var(--danger);
      color: #ffffff;
    }

    /* Dashboard Layout */
    .student-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      background: rgba(11, 19, 41, 0.7);
      border: 1px solid var(--border);
      padding: 22px;
      border-radius: 20px;
      margin-bottom: 24px;
    }

    .student-form .btn-submit {
      grid-column: 1 / -1;
      margin-top: 4px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-input-wrap {
      flex: 1;
      min-width: 260px;
    }

    .btn-export {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0 18px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-export:hover {
      background: var(--success);
      color: #ffffff;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(8, 14, 30, 0.75);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
      white-space: nowrap;
    }

    th {
      background: rgba(15, 23, 42, 0.95);
      color: var(--text-muted);
      font-weight: 700;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.6px;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .badge-roll {
      background: rgba(6, 182, 212, 0.15);
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 700;
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .btn-delete {
      background: rgba(244, 63, 94, 0.15);
      color: var(--danger);
      border: 1px solid rgba(244, 63, 94, 0.3);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: #ffffff;
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Screen 1: Master Password Set / Login -->
  <div class="container auth-container" id="authSection">
    <div class="header-branding">
      <div class="rotating-badge-box">
        <svg class="circular-text-svg" viewBox="0 0 160 160">
          <defs>
            <path id="authCirclePath" d="M 80, 80 m -62, 0 a 62,62 0 1,1 124,0 a 62,62 0 1,1 -124,0" />
          </defs>
          <text>
            <textPath xlink:href="#authCirclePath" startOffset="0%">
              WELCOME TO THE STUDENT MANAGEMENT PORTAL •
            </textPath>
          </text>
        </svg>

        <div class="core-circle">
          <svg class="student-svg-icon" viewBox="0 0 24 24">
            <path d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18C5 19.94 8.13 22 12 22C15.87 22 19 19.94 19 17.18V13.18L12 17L5 13.18Z"/>
          </svg>
        </div>
      </div>

      <h2 class="portal-title" id="authHeaderTitle">Security Check</h2>
      <p class="portal-subtitle" id="authHeaderSubtitle">Create your device master password</p>
    </div>

    <!-- First Time: Create Password -->
    <form class="auth-form-box" id="setupForm">
      <div class="form-group">
        <label>Set Master Password</label>
        <input type="password" id="createPass" placeholder="Enter new password" required />
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPass" placeholder="Re-enter password" required />
      </div>
      <button type="submit" class="btn-submit">Save Password & Continue ➜</button>
    </form>

    <!-- Subsequent Times: Unlock -->
    <form class="auth-form-box hidden" id="loginForm">
      <div class="form-group">
        <label>Enter Master Password</label>
        <input type="password" id="loginPass" placeholder="Enter password to unlock" required />
      </div>
      <button type="submit" class="btn-submit">Unlock Portal 🔓</button>
    </form>
  </div>

  <!-- Screen 2: Main Student Management Dashboard -->
  <div class="container hidden" id="dashboardSection">
    <div class="header-branding">
      <div class="header-actions">
        <button class="btn-logout" onclick="logoutSession()">Lock Portal 🔒</button>
      </div>

      <div class="rotating-badge-box">
        <svg class="circular-text-svg" viewBox="0 0 160 160">
          <defs>
            <path id="dashCirclePath" d="M 80, 80 m -62, 0 a 62,62 0 1,1 124,0 a 62,62 0 1,1 -124,0" />
          </defs>
          <text>
            <textPath xlink:href="#dashCirclePath" startOffset="0%">
              WELCOME TO THE STUDENT MANAGEMENT PORTAL •
            </textPath>
          </text>
        </svg>

        <div class="core-circle">
          <svg class="student-svg-icon" viewBox="0 0 24 24">
            <path d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18C5 19.94 8.13 22 12 22C15.87 22 19 19.94 19 17.18V13.18L12 17L5 13.18Z"/>
          </svg>
        </div>
      </div>

      <h2 class="portal-title">Student Management Portal</h2>
      <p class="portal-subtitle">Department of Information Technology</p>
    </div>

    <!-- Student Form -->
    <form class="student-form" id="studentForm">
      <div class="form-group">
        <label>Roll Number</label>
        <input type="text" id="rollNo" placeholder="e.g. 210105001" required />
      </div>

      <div class="form-group">
        <label>Student Name</label>
        <input type="text" id="name" placeholder="Full Name" required />
      </div>

      <div class="form-group">
        <label>Branch</label>
        <input type="text" id="branch" placeholder="e.g. Information Technology" required />
      </div>

      <div class="form-group">
        <label>Father's Name</label>
        <input type="text" id="fatherName" placeholder="Father's Full Name" required />
      </div>

      <div class="form-group">
        <label>Mother's Name</label>
        <input type="text" id="motherName" placeholder="Mother's Full Name" required />
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="student@example.com" required />
      </div>

      <div class="form-group">
        <label>Aadhaar Number</label>
        <input type="text" id="aadhaarNo" placeholder="12-digit Aadhaar No" maxlength="12" pattern="[0-9]{12}" required />
      </div>

      <div class="form-group">
        <label>APAAR ID</label>
        <input type="text" id="apaarId" placeholder="12-digit APAAR ID" required />
      </div>

      <div class="form-group">
        <label>Student Mobile No</label>
        <input type="tel" id="studentMobile" placeholder="10-digit number" pattern="[0-9]{10}" required />
      </div>

      <div class="form-group">
        <label>Father's Mobile No</label>
        <input type="tel" id="fatherMobile" placeholder="10-digit number" pattern="[0-9]{10}" required />
      </div>

      <button type="submit" class="btn-submit">Register New Student ➜</button>
    </form>

    <!-- Search & Export -->
    <div class="toolbar">
      <div class="search-input-wrap">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="🔍 Search by Roll No, Name, Aadhaar, APAAR ID, or Email..." 
          onkeyup="searchRecords()"
        />
      </div>
      <button class="btn-export" onclick="exportToCSV()">Export to Excel/CSV ⬇</button>
    </div>

    <!-- Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Branch</th>
            <th>Father's Name</th>
            <th>Mother's Name</th>
            <th>Email</th>
            <th>Aadhaar No</th>
            <th>APAAR ID</th>
            <th>Student Phone</th>
            <th>Father Phone</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="studentTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // Authentication Logic (Device-Specific Isolation)
    const AUTH_KEY = "portal_device_master_hash";
    const SESSION_KEY = "portal_active_session";

    const authSection = document.getElementById("authSection");
    const dashboardSection = document.getElementById("dashboardSection");
    const setupForm = document.getElementById("setupForm");
    const loginForm = document.getElementById("loginForm");
    const authHeaderTitle = document.getElementById("authHeaderTitle");
    const authHeaderSubtitle = document.getElementById("authHeaderSubtitle");

    function checkAuthFlow() {
      const savedPass = localStorage.getItem(AUTH_KEY);
      const isUnlocked = sessionStorage.getItem(SESSION_KEY);

      if (isUnlocked === "true") {
        showDashboard();
        return;
      }

      authSection.classList.remove("hidden");
      dashboardSection.classList.add("hidden");

      if (!savedPass) {
        // Naya user: password create karega
        setupForm.classList.remove("hidden");
        loginForm.classList.add("hidden");
        authHeaderTitle.innerText = "Setup Master Password";
        authHeaderSubtitle.innerText = "Create your own password for this device";
      } else {
        // Purana user: password enter karega
        setupForm.classList.add("hidden");
        loginForm.classList.remove("hidden");
        authHeaderTitle.innerText = "Security Verification";
        authHeaderSubtitle.innerText = "Enter your password to unlock";
      }
    }

    setupForm.addEventListener("submit", function(e) {
      e.preventDefault();
      const p1 = document.getElementById("createPass").value;
      const p2 = document.getElementById("confirmPass").value;

      if (p1.length < 4) {
        alert("Password must be at least 4 characters long!");
        return;
      }
      if (p1 !== p2) {
        alert("Passwords do not match. Please try again!");
        return;
      }

      localStorage.setItem(AUTH_KEY, btoa(p1));
      sessionStorage.setItem(SESSION_KEY, "true");
      showDashboard();
    });

    loginForm.addEventListener("submit", function(e) {
      e.preventDefault();
      const entered = document.getElementById("loginPass").value;
      const saved = localStorage.getItem(AUTH_KEY);

      if (btoa(entered) === saved) {
        sessionStorage.setItem(SESSION_KEY, "true");
        showDashboard();
      } else {
        alert("Incorrect password! Access denied.");
      }
    });

    function showDashboard() {
      authSection.classList.add("hidden");
      dashboardSection.classList.remove("hidden");
      renderTable(students);
    }

    function logoutSession() {
      sessionStorage.removeItem(SESSION_KEY);
      document.getElementById("loginPass").value = "";
      checkAuthFlow();
    }

    // Student Database Logic
    let students = JSON.parse(localStorage.getItem("students_master_db")) || [];

    const form = document.getElementById("studentForm");
    const tableBody = document.getElementById("studentTableBody");
    const searchInput = document.getElementById("searchInput");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const rollNo = document.getElementById("rollNo").value.trim();
      const name = document.getElementById("name").value.trim();
      const branch = document.getElementById("branch").value.trim();
      const fatherName = document.getElementById("fatherName").value.trim();
      const motherName = document.getElementById("motherName").value.trim();
      const email = document.getElementById("email").value.trim();
      const aadhaarNo = document.getElementById("aadhaarNo").value.trim();
      const apaarId = document.getElementById("apaarId").value.trim();
      const studentMobile = document.getElementById("studentMobile").value.trim();
      const fatherMobile = document.getElementById("fatherMobile").value.trim();

      if (students.some(s => s.rollNo.toLowerCase() === rollNo.toLowerCase())) {
        alert("Roll Number already registered!");
        return;
      }
      if (students.some(s => s.aadhaarNo === aadhaarNo)) {
        alert("This Aadhaar Number is already associated with an existing record!");
        return;
      }

      const newRecord = {
        rollNo,
        name,
        branch,
        fatherName,
        motherName,
        email,
        aadhaarNo,
        apaarId,
        studentMobile,
        fatherMobile
      };

      students.push(newRecord);
      localStorage.setItem("students_master_db", JSON.stringify(students));
      
      form.reset();
      renderTable(students);
    });

    function renderTable(data) {
      tableBody.innerHTML = "";

      if (data.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="11" class="empty-state">No student records found matching your query.</td>
          </tr>
        `;
        return;
      }

      data.forEach((st) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><span class="badge-roll">${st.rollNo}</span></td>
          <td><strong style="color:#ffffff;">${st.name}</strong></td>
          <td>${st.branch}</td>
          <td>${st.fatherName}</td>
          <td>${st.motherName}</td>
          <td>${st.email}</td>
          <td>${st.aadhaarNo}</td>
          <td>${st.apaarId}</td>
          <td>${st.studentMobile}</td>
          <td>${st.fatherMobile}</td>
          <td>
            <button class="btn-delete" onclick="deleteRecord('${st.rollNo}')">Delete</button>
          </td>
        `;
        tableBody.appendChild(tr);
      });
    }

    function deleteRecord(rollNo) {
      if (confirm(`Remove record for Roll Number: ${rollNo}?`)) {
        students = students.filter(s => s.rollNo !== rollNo);
        localStorage.setItem("students_master_db", JSON.stringify(students));
        renderTable(students);
      }
    }

    function searchRecords() {
      const q = searchInput.value.toLowerCase().trim();
      const filtered = students.filter(st => 
        st.rollNo.toLowerCase().includes(q) ||
        st.name.toLowerCase().includes(q) ||
        st.email.toLowerCase().includes(q) ||
        st.aadhaarNo.includes(q) ||
        st.apaarId.toLowerCase().includes(q) ||
        st.studentMobile.includes(q)
      );
      renderTable(filtered);
    }

    function exportToCSV() {
      if (students.length === 0) {
        alert("No student data available to export!");
        return;
      }

      const headers = ["Roll No", "Student Name", "Branch", "Father Name", "Mother Name", "Email", "Aadhaar No", "APAAR ID", "Student Mobile", "Father Mobile"];
      const rows = students.map(s => [
        `"${s.rollNo}"`,
        `"${s.name}"`,
        `"${s.branch}"`,
        `"${s.fatherName}"`,
        `"${s.motherName}"`,
        `"${s.email}"`,
        `"${s.aadhaarNo}"`,
        `"${s.apaarId}"`,
        `"${s.studentMobile}"`,
        `"${s.fatherMobile}"`
      ]);

      const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Student_Records_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // App Initialization
    checkAuthFlow();
  </script>
</body>
</html>
